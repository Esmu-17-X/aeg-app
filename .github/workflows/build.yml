name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/esmu-os-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esmu-os-debug-apk
          path: out/esmu-os-debug.apk
          retention-days: 30
