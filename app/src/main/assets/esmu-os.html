<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Esmu OS</title>
<style>
:root{--base:#05070f;--surface:#0a1022;--surface2:#131b36;--text:#e4f0ff;--muted:#8499c0;--line:rgba(120,190,255,.2);--accent:#22d3ee;--on-accent:#04121a;--danger:#ff5d7a;--acc-rgb:34,211,238;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--base);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#wall{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 50% at 18% 14%,rgba(124,58,237,.55),transparent 70%),radial-gradient(50% 45% at 86% 24%,rgba(236,72,153,.38),transparent 70%),radial-gradient(70% 60% at 62% 96%,rgba(14,165,233,.38),transparent 70%),linear-gradient(180deg,#04050d,#0a0925 60%,#150b2e)}
#os{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr}
#bar{height:38px;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(4,8,20,.66);backdrop-filter:blur(18px);border-bottom:1px solid rgba(var(--acc-rgb),.3);font-size:13px;font-weight:600;color:#fff}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:12px}
.dotmark{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--accent) 55%,transparent 75%);box-shadow:0 0 12px var(--accent)}
.sp{flex:1}
#ftitle{opacity:.78;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
#bat{opacity:.85;font-size:12px}
#clock{font-weight:600}
#desk{position:relative;overflow:hidden}
#home{position:absolute;inset:0;padding:22px}
.widget{position:absolute;right:30px;top:22px;text-align:right;color:#fff;text-shadow:0 0 30px rgba(var(--acc-rgb),.6),0 2px 20px rgba(0,0,0,.6)}
.widget .time{font-weight:700;font-size:clamp(46px,11vw,88px);line-height:.95;letter-spacing:.02em}
.widget .date{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-top:8px;font-weight:500}
.widget .meta{font-size:12px;margin-top:4px;opacity:.78;font-family:ui-monospace,monospace}
#grid{display:flex;flex-direction:column;flex-wrap:wrap;gap:14px 8px;align-content:flex-start;height:calc(100% - 4px);width:220px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;padding:4px;border:0;border-radius:14px;background:none;color:#fff;font-size:12px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.55)}
.app:hover .ic{transform:translateY(-2px)}
.ic{width:56px;height:56px;border-radius:18px 6px 18px 6px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.4),0 8px 20px rgba(0,0,0,.55),0 0 22px rgba(var(--acc-rgb),.18);transition:transform .15s;background-size:cover;background-position:center}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
#wins{position:absolute;inset:0;z-index:5;pointer-events:none}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;gap:8px;padding:8px 10px;border-radius:16px;background:rgba(4,8,20,.66);border:1px solid rgba(var(--acc-rgb),.35);backdrop-filter:blur(20px);box-shadow:0 0 36px rgba(var(--acc-rgb),.14),0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 24px);overflow-x:auto}
#dock button{position:relative;width:48px;height:48px;padding:0;border:0;border-radius:14px 5px 14px 5px;background:none;flex:none}
#dock .ic{width:48px;height:48px;border-radius:14px 5px 14px 5px}
#dock .ic svg{width:24px;height:24px}
#dock .run{position:absolute;bottom:-7px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);opacity:0}
#dock button.running .run{opacity:.95}
.win{position:absolute;display:flex;flex-direction:column;min-width:300px;min-height:200px;background:var(--surface);color:var(--text);border:1px solid rgba(var(--acc-rgb),.26);border-radius:10px;overflow:hidden;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .16s ease-out}
.win.focused{border-color:rgba(var(--acc-rgb),.65);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.22),0 0 38px rgba(var(--acc-rgb),.2),0 24px 60px rgba(0,0,0,.6)}
.win.min{display:none}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.tb{display:flex;align-items:center;gap:8px;height:42px;padding:0 8px 0 10px;background:linear-gradient(180deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),.04)),var(--surface2);border-bottom:1px solid rgba(var(--acc-rgb),.3);user-select:none;touch-action:none;cursor:grab}
.tic{width:22px;height:22px;border-radius:8px 3px 8px 3px;display:grid;place-items:center;color:#fff;flex:none}
.tic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ttl{flex:1;min-width:0;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:30px;height:30px;border:0;border-radius:8px;background:none;display:grid;place-items:center}
.tb button:hover{background:rgba(var(--acc-rgb),.18)}
.tb button.x:hover{background:var(--danger);color:#fff}
.tb button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.wb{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.ar{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none}
.rz::after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);opacity:.6}
.btn{border:1px solid rgba(var(--acc-rgb),.32);background:var(--surface2);color:var(--text);padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600}
.btn:hover{background:rgba(var(--acc-rgb),.16)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:0 0 18px rgba(var(--acc-rgb),.4)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.ib{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--muted);flex:none}
.ib:hover{background:var(--line);color:var(--text)}
.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-note{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.5}
.s-in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);font:inherit}
.s-sec{padding:16px;border-bottom:1px solid var(--line)}
.s-sec h3{margin:0 0 12px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-left:3px solid var(--accent);padding-left:10px}
.set{overflow:auto}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.info{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.info dt{color:var(--muted)}.info dd{margin:0;font-weight:500}
.ph-perm{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ph-ok{color:#4ade80;font-weight:600}
.ph-panel{flex:1;min-height:0;overflow:auto}
.ph-top{flex:none;padding:8px;overflow-x:auto;border-bottom:1px solid var(--line)}
.ph-top .seg{display:flex;width:max-content}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 6px;padding:12px}
.ph-app{width:auto;color:var(--text);text-shadow:none}
.ph-app span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:1.25;text-align:center}
.ph-video{display:block;width:100%;max-height:52vh;border-radius:10px;background:#000;object-fit:cover}
.ph-shot{max-width:100%;max-height:60vh;margin-top:10px;border-radius:10px}
.f-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.f-path{flex:1;min-width:120px;font:500 13px ui-monospace,monospace;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--text)}
.chip:hover{background:var(--line)}
.f-list{flex:1;min-height:0;overflow:auto;padding:4px 6px}
.f-row{display:flex;align-items:center;gap:2px;border-radius:10px}
.f-row:hover{background:var(--surface2)}
.f-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;text-align:left;border-radius:10px;color:var(--text)}
.f-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff}
.f-ic svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f-nm{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-mt{font-size:12px;color:var(--muted);flex:none}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface2);border:1px solid rgba(var(--acc-rgb),.3);border-radius:11px}
.seg button{border:0;background:none;color:var(--muted);padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.2)}
#modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(10,6,24,.5);backdrop-filter:blur(3px)}
.dlg{width:min(380px,100%);padding:20px;border-radius:16px;background:var(--surface);color:var(--text);box-shadow:0 0 40px rgba(var(--acc-rgb),.18),0 20px 50px rgba(0,0,0,.4);border:1px solid rgba(var(--acc-rgb),.4)}
.dlg h2{margin:0 0 6px;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.dlg p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.5;white-space:pre-line}
.dlg-in{width:100%;margin:6px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);font:inherit}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;bottom:100px;z-index:200;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:#17122c;color:#fff;font-size:14px;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#02030a;color:#bfe6ff;transition:opacity .35s;cursor:pointer}
#boot.done{opacity:0}
#bootlog{position:absolute;left:18px;top:18px;max-width:calc(100% - 36px);margin:0;font:12px/1.6 ui-monospace,monospace;color:rgba(var(--acc-rgb),.9);white-space:pre-wrap}
#logo{text-align:center;position:relative}
#logo .mark{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fff,var(--accent) 40%,transparent 72%)}
#logo h1{margin:0;font-size:40px;letter-spacing:.32em;margin-right:-.32em;color:#fff;text-shadow:0 0 24px rgba(var(--acc-rgb),.7)}
#logo p{margin:8px 0 0;font:500 12px ui-monospace,monospace;letter-spacing:.34em;color:var(--accent)}
.t-key{color:var(--accent)}.t-dir{color:#5ad0ff;font-weight:600}.t-pkg{color:#6ee7b7}.t-cmd{color:#fff}.t-err{color:#ff8da1}.t-dim{color:#9a93bd}
.term{display:block;overflow:auto;background:#030610;color:#d6ebff;font:13.5px/1.5 ui-monospace,monospace;padding:10px 12px;box-shadow:inset 0 0 40px rgba(var(--acc-rgb),.08)}
.t-out{white-space:pre-wrap;word-break:break-word}
.t-row{display:flex;flex-wrap:wrap;align-items:baseline}
.t-ps{color:var(--accent);white-space:pre}
.t-in{flex:1 1 8ch;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;padding:0;caret-color:var(--accent)}
.n-ta{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;background:var(--surface);color:var(--text);padding:14px 16px;font:16px/1.65 system-ui,sans-serif}
.n-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.n-path{flex:1;min-width:0;font:500 12.5px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="wall"></div>

<div id="os" hidden>
  <header id="bar">
    <span class="brand"><i class="dotmark"></i>Esmu</span>
    <span id="ftitle"></span>
    <span class="sp"></span>
    <span id="bat" hidden></span>
    <span id="clock"></span>
    <button id="sysbtn" aria-label="Settings" style="width:28px;height:28px;border:0;border-radius:8px;background:none;color:#fff;display:grid;place-items:center">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4"/><circle cx="15" cy="17" r="2.4"/></svg>
    </button>
  </header>
  <main id="desk">
    <section id="home">
      <div class="widget">
        <div id="w-time" class="time"></div>
        <div id="w-date" class="date"></div>
        <div id="w-meta" class="meta"></div>
      </div>
      <nav id="grid"></nav>
    </section>
    <div id="wins"></div>
    <nav id="dock"></nav>
  </main>
</div>

<div id="modal" hidden></div>
<div id="toast"></div>

<div id="boot" hidden>
  <pre id="bootlog"></pre>
  <div id="logo"><div class="mark"></div><h1>ESMU</h1><p>ORBITAL OS 1.0</p></div>
  <p style="position:absolute;bottom:22px;font-size:12px;color:#6d6590;margin:0">Tap to skip</p>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- native bridge ---------- */
const NATIVE = !!(window.EsmuNative && typeof window.EsmuNative.postMessage === 'function');
const nat = {
  pending: new Map(), seq: 0,
  call(method, args) {
    return new Promise((resolve, reject) => {
      if (!NATIVE) { reject(new Error('Only available in the Esmu OS Android app')); return; }
      const id = ++nat.seq;
      const t = setTimeout(() => { if (nat.pending.delete(id)) reject(new Error('Timeout')); }, 60000);
      nat.pending.set(id, { resolve: v => { clearTimeout(t); resolve(v); }, reject: e => { clearTimeout(t); reject(e); } });
      try { window.EsmuNative.postMessage(JSON.stringify({ id, method, args: args || {} })); } catch (e) { nat.pending.delete(id); clearTimeout(t); reject(e); }
    });
  }
};
if (NATIVE) window.EsmuNative.onmessage = ev => {
  try { const m = JSON.parse(ev.data), p = nat.pending.get(m.id); if (!p) return; nat.pending.delete(m.id); if (m.error) p.reject(new Error(m.error)); else p.resolve(m.result); } catch (e) {}
};

/* ---------- toast + dialog ---------- */
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400);
}
function dlg(o) {
  return new Promise(resolve => {
    const m = $('#modal'); m.hidden = false;
    const input = o.input ? h('input', { class: 'dlg-in', type: 'text', value: o.value || '', 'aria-label': o.title }) : null;
    const done = v => { m.hidden = true; m.replaceChildren(); resolve(v); };
    const ok = h('button', { class: 'btn ' + (o.danger ? 'danger' : 'pri'), onclick: () => done(input ? (input.value.trim() || null) : true) }, o.ok || 'OK');
    const cancel = h('button', { class: 'btn', onclick: () => done(input ? null : false) }, 'Cancel');
    m.replaceChildren(h('div', { class: 'dlg', role: 'dialog' },
      h('h2', null, o.title), o.text ? h('p', null, o.text) : null, input, h('div', { class: 'dlg-act' }, cancel, ok)));
    (input || ok).focus(); if (input) input.select();
  });
}

/* ---------- app definitions ---------- */
const GLYPH = {
  terminal: '<polyline points="5 8 10 12 5 16"/><line x1="12" y1="17" x2="19" y2="17"/>',
  files: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  notes: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><line x1="9" y1="13" x2="16" y2="13"/>',
  calc: '<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7.5" x2="16" y2="7.5"/>',
  clock: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>',
  monitor: '<polyline points="3 13 7 13 9.5 6 13 18 15.5 11 21 11"/>',
  settings: '<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.4"/><circle cx="15" cy="17" r="2.4"/>',
  store: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  music: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>'
};
const svgOf = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + GLYPH[k] + '</svg>';
const APPS = {
  terminal: { name: 'Terminal', grad: 'linear-gradient(145deg,#5b4bdb,#2a1f78)', size: [660, 420], fav: 1 },
  files: { name: 'Files', grad: 'linear-gradient(145deg,#f5a524,#d97706)', size: [560, 440], fav: 1 },
  notes: { name: 'Notes', grad: 'linear-gradient(145deg,#34d399,#0f9f78)', size: [520, 440], fav: 1 },
  calc: { name: 'Calculator', grad: 'linear-gradient(145deg,#fb7185,#e11d48)', size: [330, 500] },
  clock: { name: 'Clock', grad: 'linear-gradient(145deg,#38bdf8,#0369a1)', size: [420, 520] },
  monitor: { name: 'Monitor', grad: 'linear-gradient(145deg,#a78bfa,#6d28d9)', size: [520, 470] },
  settings: { name: 'Settings', grad: 'linear-gradient(145deg,#94a3b8,#475569)', size: [500, 520], fav: 1 },
  store: { name: 'Store', grad: 'linear-gradient(145deg,#2dd4bf,#0f766e)', size: [500, 540] },
  music: { name: 'Music', grad: 'linear-gradient(145deg,#8b5cf6,#5b21b6)', size: [520, 620], fav: 1 },
  phone: { name: 'Phone', grad: 'linear-gradient(145deg,#34d399,#0ea5e9)', size: [580, 640], fav: 1 }
};

/* ---------- window manager ---------- */
const desk = $('#desk'), winsEl = $('#wins');
const procs = new Map();
let uid = 0, nextPid = 100, zTop = 10, front = null;

const ICO = {
  min: '<svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/></svg>',
  max: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
  x: '<svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>'
};

const iconSpan = (k, cls) => {

}
function place(w) { const s = w.el.style; s.left = w.x + 'px'; s.top = w.y + 'px'; s.width = w.w + 'px'; s.height = w.h + 'px'; }
function dragify(w, tb) {

}

    const shareT = h('input', { class: 's-in', value: 'Sent from Esmu OS' });
    const SET = [['wifi', 'Wi-Fi'], ['bluetooth', 'Bluetooth'], ['display', 'Display'], ['sound', 'Sound'], ['battery', 'Battery'], ['location', 'Location'], ['apps', 'Apps'], ['home', 'Home']];
    panel.replaceChildren(
      h('div', { class: 's-sec' }, h('h3', null, 'Location'), h('button', { class: 'btn pri', onclick: loc }, 'Where am I?'), out),
      h('div', { class: 's-sec' }, h('h3', null, 'Notification'), nTitle, nText, h('div', { style: { marginTop: '10px' } }, h('button', { class: 'btn pri', onclick: async () => { try { await nat.call('notify', { title: nTitle.value, text: nText.value }); toast('Sent'); } catch (e) { fail(e); } } }, 'Send'))),
      h('div', { class: 's-sec' }, h('h3', null, 'Share'), shareT, h('div', { style: { marginTop: '10px' } }, h('button', { class: 'btn', onclick: () => nat.call('share', { text: shareT.value }).catch(fail) }, 'Share…'))),
      h('div', { class: 's-sec' }, h('h3', null, 'Hardware'), h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
        h('button', { class: 'btn', onclick: () => nat.call('vibrate', { ms: 80 }).catch(fail) }, 'Short buzz'),
        h('button', { class: 'btn', onclick: () => nat.call('vibrate', { ms: 600 }).catch(fail) }, 'Long buzz'))),
      h('div', { class: 's-sec' }, h('h3', null, 'Android settings'), h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } }, SET.map(([k, l]) => h('button', { class: 'btn', onclick: () => nat.call('settings.open', { page: k }).catch(fail) }, l)))));
  }

  const onVis = () => { if (!document.hidden && alive && (tab === 'device' || tab === 'files' || tab === 'contacts')) show(tab); };
  document.addEventListener('visibilitychange', onVis);
  show('device');
  return { destroy() { alive = false; stopCam(); document.removeEventListener('visibilitychange', onVis); } };
};

/* Files */
WIN_APPS.files = (body, w) => {
  body.append(h('div', { class: 'ar' }, h('div', { class: 'empty' }, 'Use the Phone app to browse your real /sdcard.')));
  return {};
};

/* Notes */
WIN_APPS.notes = (body, w) => {
  const ta = h('textarea', { class: 'n-ta', placeholder: 'Write here…' });
  body.append(h('div', { class: 'ar' }, h('div', { class: 'n-bar' }, h('div', { class: 'n-path' }, 'quick note')), ta));
  ta.value = store.get('esmu.note', '');
  ta.addEventListener('input', () => store.set('esmu.note', ta.value));
  setTimeout(() => ta.focus(), 30);
  return { onFocus() { ta.focus(); } };
};

/* Calc */
WIN_APPS.calc = (body, w) => {
  let expr = '';
  const display = h('div', { style: { fontSize: '42px', textAlign: 'right', padding: '20px', fontWeight: '700' } }, '0');
  const KEYS = ['C', '(', ')', '/', '7', '8', '9', '*', '4', '5', '6', '-', '1', '2', '3', '+', '0', '.', '←', '='];
  const keys = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '8px', padding: '12px' } }, KEYS.map(k => h('button', { class: 'btn', style: { height: '52px', fontSize: '18px', fontWeight: '600' }, onclick: () => press(k) }, k)));
  body.append(h('div', { class: 'ar' }, display, keys));
  function press(k) {
    if (k === 'C') expr = '';
    else if (k === '←') expr = expr.slice(0, -1);
    else if (k === '=') { try { expr = String(eval(expr)); } catch (e) { expr = 'Error'; } }
    else expr += k;
    display.textContent = expr || '0';
  }
  return {};
};

/* Clock */
WIN_APPS.clock = (body, w) => {
  const big = h('div', { style: { fontSize: '64px', fontWeight: '700', textAlign: 'center', padding: '40px 20px' } });
  const date = h('div', { style: { textAlign: 'center', color: 'var(--muted)', fontSize: '14px' } });
  body.append(h('div', { class: 'ar', style: { justifyContent: 'center' } }, big, date));
  const iv = setInterval(() => {
    const d = new Date();
    big.textContent = d.toLocaleTimeString();
    date.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  }, 500);
  return { destroy() { clearInterval(iv); } };
};

/* Monitor */
WIN_APPS.monitor = (body, w) => {
  const list = h('div', { style: { padding: '16px', fontSize: '14px' } });
  body.append(h('div', { class: 'ar', style: { overflow: 'auto' } }, list));
  const draw = () => {
    list.replaceChildren(...[...procs.values()].map(p => h('div', { class: 'ph-perm' }, h('span', null, p.pid + ' · ' + APPS[p.appId].name), h('button', { class: 'btn', onclick: () => close(p.id) }, 'End'))));
  };
  draw(); setInterval(draw, 1000);
  return {};
};

/* Settings */
WIN_APPS.settings = (body, w) => {
  const info = [
    ['System', 'Esmu OS 1.0'],
    ['Display', innerWidth + ' × ' + innerHeight],
    ['Native bridge', NATIVE ? 'Connected' : 'Not available'],
    ['Apps', Object.keys(APPS).length + ' installed']
  ];
  body.append(h('div', { class: 'set ar', style: { overflow: 'auto' } },
    h('div', { class: 's-sec' }, h('h3', null, 'About'), h('dl', { class: 'info' }, info.map(([k, v]) => [h('dt', null, k), h('dd', null, v)]))),
    h('div', { class: 's-sec' }, h('h3', null, 'Data'), h('p', { class: 's-note' }, 'Reset the local note and reload the OS.'),
      h('button', { class: 'btn danger', onclick: async () => { if (await dlg({ title: 'Reset?', text: 'Clears the quick note only.', ok: 'Reset', danger: true })) { store.del('esmu.note'); location.reload(); } } }, 'Reset note'))));
  return {};
};

/* Store */
WIN_APPS.store = (body, w) => {
  body.append(h('div', { class: 'set ar' }, h('div', { class: 's-sec' }, h('h3', null, 'Store'), h('p', { class: 's-note' }, 'Nothing to install here yet. You can add apps later.'))));
  return {};
};

/* ---------- shell ---------- */
const sys = { start: Date.now() };
function buildShell() {
  const grid = $('#grid'), dock = $('#dock');
  grid.replaceChildren(...Object.keys(APPS).map(k => h('button', { class: 'app', onclick: () => openApp(k) }, icon(k), h('span', null, APPS[k].name))));
  dock.replaceChildren(...Object.keys(APPS).filter(k => APPS[k].fav).map(k => h('button', { 'data-app': k, title: APPS[k].name, onclick: () => dockClick(k) }, icon(k), h('i', { class: 'run' }))));
}
function updateClock() {
  const d = new Date(), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('#clock').textContent = t;
  $('#w-time').textContent = t.replace(/\s?[AP]M$/i, '');
  $('#w-date').textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  $('#w-meta').textContent = procs.size + ' app' + (procs.size === 1 ? '' : 's') + ' running';
}
$('#sysbtn').addEventListener('click', () => openApp('settings'));
setInterval(updateClock, 1000);
updateClock();

if (NATIVE) {
  const pollBat = () => nat.call('battery').then(b => { const el = $('#bat'); el.hidden = false; el.textContent = b.level + '%' + (b.charging ? ' ⚡' : ''); }).catch(() => {});
  pollBat(); setInterval(pollBat, 60000);
}

/* ---------- boot ---------- */
async function boot() {
  const b = $('#boot'), log = $('#bootlog');
  $('#os').hidden = true; b.hidden = false; b.classList.remove('done'); log.textContent = '';
  const lines = [
    'esmu-kernel 1.0.0 booting',
    '[ok] display ' + innerWidth + 'x' + innerHeight,
    '[ok] native bridge: ' + (NATIVE ? 'connected' : 'missing'),
    '[ok] shell ready',
    '[ok] all systems nominal'
  ];
  for (const l of lines) { log.textContent += l + '\n'; await sleep(120); }
  await sleep(600);
  b.classList.add('done'); await sleep(300);
  b.hidden = true; $('#os').hidden = false;
  sys.start = Date.now();
}
window.__esmuBack = () => {
  if (!$('#modal').hidden) { $('#modal').hidden = true; return true; }
  if (front) { minimize(front); return true; }
  return false;
};
if (!NATIVE) delete APPS.phone;
buildShell();
render();
boot();
})();
</script>
</body>
</html>
