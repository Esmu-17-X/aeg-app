<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070f">
<title>Esmu OS</title>
<style>
/* FIX 1: Changed body to handle touches better */
:root{--base:#05070f;--surface:#0a1022;--surface2:#131b36;--text:#e4f0ff;--muted:#8499c0;--line:rgba(120,190,255,.2);--accent:#22d3ee;--on-accent:#04121a;--danger:#ff5d7a;--acc-rgb:34,211,238;color-scheme:dark}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation;}
html,body{height:100%;margin:0;background:var(--base);color:var(--text);font-family:system-ui,sans-serif;overflow:hidden;}
button{font:inherit;color:inherit;cursor:pointer; border:none; background:none;}
#wall{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 50% at 18% 14%,rgba(124,58,237,.55),transparent 70%),linear-gradient(180deg,#04050d,#0a0925 60%,#150b2e)}
#os{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr}
#bar{height:38px;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(4,8,20,.66);backdrop-filter:blur(18px);border-bottom:1px solid rgba(var(--acc-rgb),.3);font-size:13px;color:#fff; z-index: 100;}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;text-transform:uppercase;font-size:12px}
.dotmark{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.sp{flex:1}
#clock{font-weight:600}
#desk{position:relative;overflow:hidden}
#home{position:absolute;inset:0;padding:22px}
.widget{position:absolute;right:30px;top:22px;text-align:right;color:#fff;}
.widget .time{font-weight:700;font-size:clamp(46px,11vw,88px);line-height:.95;}
.widget .date{font-size:12px;color:var(--accent);margin-top:8px;font-weight:500}
#grid{display:flex;flex-direction:column;flex-wrap:wrap;gap:14px 8px;align-content:flex-start;height:calc(100% - 4px);width:220px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;padding:4px;border-radius:14px;color:#fff;font-size:12px;}
.app:active .ic{transform:scale(0.95)}
.ic{width:56px;height:56px;border-radius:18px 6px 18px 6px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#5b4bdb,#2a1f78);transition:transform .15s}
.ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#wins{position:absolute;inset:0;z-index:5;pointer-events:none}
#dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;display:flex;gap:8px;padding:8px 10px;border-radius:16px;background:rgba(4,8,20,.66);border:1px solid rgba(var(--acc-rgb),.35); backdrop-filter:blur(20px); max-width:calc(100% - 24px); overflow-x:auto;}
#dock button{width:48px;height:48px;padding:0;border-radius:14px 5px 14px 5px;}
#dock .ic{width:48px;height:48px;border-radius:14px 5px 14px 5px}
#dock .ic svg{width:24px;height:24px}
.win{position:absolute;display:flex;flex-direction:column;min-width:300px;background:var(--surface);color:var(--text);border:1px solid rgba(var(--acc-rgb),.26);border-radius:10px;overflow:hidden;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.5); animation:pop .16s ease-out;}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.tb{display:flex;align-items:center;gap:8px;height:42px;padding:0 8px 0 10px;background:var(--surface2);border-bottom:1px solid var(--line);}
.tic{width:22px;height:22px;border-radius:8px 3px 8px 3px;display:grid;place-items:center;color:#fff;background:var(--accent)}
.ttl{flex:1;font-size:11.5px;font-weight:700;text-transform:uppercase;}
.tb button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;}
.wb{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.ar{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.btn{border:1px solid rgba(var(--acc-rgb),.32);background:var(--surface2);color:var(--text);padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600; margin: 4px;}
.btn.pri{background:var(--accent);color:var(--on-accent);}
.s-in{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);color:var(--text);font:inherit; margin-bottom: 8px;}
.s-sec{padding:16px;border-bottom:1px solid var(--line)}
.s-sec h3{margin:0 0 12px;font-size:12.5px;text-transform:uppercase;border-left:3px solid var(--accent);padding-left:10px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;}
.term{display:block;overflow:auto;background:#030610;color:#d6ebff;font:13.5px/1.5 monospace;padding:10px 12px; flex: 1;}
.f-row{display:flex;align-items:center;border-bottom:1px solid var(--line);}
.f-main{flex:1;padding:12px;text-align:left; color: var(--text);}
.ph-perm{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ph-ok{color:#4ade80;font-weight:600}
.ph-panel{flex:1;min-height:0;overflow:auto}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 6px;padding:12px}
.ph-video{display:block;width:100%;max-height:52vh;background:#000;object-fit:cover}
.ph-shot{max-width:100%;margin-top:10px;}
.f-path{flex:1;font:500 13px monospace;color:var(--muted); overflow: hidden;}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:12.5px; color: var(--text); margin: 4px;}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface2);border-radius:11px}
.seg button{padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600; color: var(--text)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.2)}
#modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;background:rgba(10,6,24,.5);backdrop-filter:blur(3px)}
.dlg{width:min(380px,100%);padding:20px;border-radius:16px;background:var(--surface);color:var(--text);border:1px solid var(--accent)}
#toast{position:fixed;left:50%;bottom:100px;z-index:200;padding:10px 16px;border-radius:12px;background:#17122c;color:#fff;font-size:14px;opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:all .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#02030a;color:#bfe6ff;transition:opacity .35s}
#boot.done{opacity:0}
#logo{text-align:center;}
#logo .mark{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 36% 34%,#fff,var(--accent) 40%,transparent 72%)}
</style>
</head>
<body>
<div id="wall"></div>

<div id="os" hidden>
  <header id="bar">
    <span class="brand"><i class="dotmark"></i>Esmu</span>
    <span id="ftitle"></span>
    <span class="sp"></span>
    <span id="clock"></span>
  </header>
  <main id="desk">
    <section id="home">
      <div class="widget">
        <div id="w-time" class="time"></div>
        <div id="w-date" class="date"></div>
      </div>
      <nav id="grid"></nav>
    </section>
    <div id="wins"></div>
    <nav id="dock"></nav>
  </main>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>

<div id="boot" hidden>
  <div id="logo"><div class="mark"></div><h1>ESMU</h1><p>ORBITAL OS 1.0</p></div>
</div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const NATIVE = !!(window.EsmuNative && typeof window.EsmuNative.postMessage === 'function');
const nat = {
  pending: new Map(), seq: 0,
  call(method, args) {
    return new Promise((resolve, reject) => {
      if (!NATIVE) { reject(new Error('Only available in the Esmu OS Android app')); return; }
      const id = ++nat.seq;
      const t = setTimeout(() => { if (nat.pending.delete(id)) reject(new Error('Timeout')); }, 60000);
      nat.pending.set(id, { resolve: v => { clearTimeout(t); resolve(v); }, reject: e => { clearTimeout(t); reject(e); } });
      try { window.EsmuNative.postMessage(JSON.stringify({ id, method, args: args || {} })); } catch (e) { nat.pending.delete(id); clearTimeout(t); reject(e); }
    });
  }
};
if (NATIVE) window.EsmuNative.onmessage = ev => {
  try { const m = JSON.parse(ev.data), p = nat.pending.get(m.id); if (!p) return; nat.pending.delete(m.id); if (m.error) p.reject(new Error(m.error)); else p.resolve(m.result); } catch (e) {}
};

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2400);
}
function dlg(o) {
  return new Promise(resolve => {
    const m = $('#modal'); m.hidden = false;
    const input = o.input ? h('input', { class: 's-in', type: 'text', value: o.value || '' }) : null;
    const done = v => { m.hidden = true; m.replaceChildren(); resolve(v); };
    const ok = h('button', { class: 'btn ' + (o.danger ? 'danger' : 'pri'), onclick: () => done(input ? (input.value.trim() || null) : true) }, o.ok || 'OK');
    const cancel = h('button', { class: 'btn', onclick: () => done(input ? null : false) }, 'Cancel');
    m.replaceChildren(h('div', { class: 'dlg' }, h('h2', null, o.title), o.text ? h('p', null, o.text) : null, input, h('div', { class: 'dlg-act', style: 'display:flex;gap:8px;justify-content:flex-end' }, cancel, ok)));
  });
}

const APPS = {
  terminal: { name: 'Terminal', size: [660, 420], fav: 1, svg: '<polyline points="5 8 10 12 5 16"/><line x1="12" y1="17" x2="19" y2="17"/>' },
  notes: { name: 'Notes', size: [520, 440], fav: 1, svg: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/>' },
  calc: { name: 'Calc', size: [330, 500], svg: '<rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="7.5" x2="16" y2="7.5"/>' },
  clock: { name: 'Clock', size: [420, 520], svg: '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>' },
  settings: { name: 'Settings', size: [500, 520], fav: 1, svg: '<line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/>' },
  music: { name: 'Music', size: [520, 620], fav: 1, svg: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>' },
  phone: { name: 'Phone', size: [580, 640], fav: 1, svg: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>' }
};
const svgOf = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + APPS[k].svg + '</svg>';
const iconSpan = (k, cls) => {
  const a = APPS[k];
  return h('span', { class: cls, style: a.img ? { backgroundImage: 'url("' + a.img + '")' } : { background: 'linear-gradient(145deg,#5b4bdb,#2a1f78)' }, html: a.img ? '' : svgOf(k) });
};
const icon = k => iconSpan(k, 'ic');

const desk = $('#desk'), winsEl = $('#wins');
const procs = new Map();
let uid = 0, nextPid = 100, zTop = 10, front = null;

const ICO = {
  min: '<svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/></svg>',
  max: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
  x: '<svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>'
};

function openApp(appId, arg) {
  const app = APPS[appId];
  if (!app) return null;
  const ex = [...procs.values()].find(w => w.appId === appId);
  if (ex) { if (arg != null && ex.api.open) ex.api.open(arg); focus(ex.id); return ex; }
  const id = 'w' + (++uid), pid = nextPid++;
  const dw = desk.clientWidth || 900, dh = desk.clientHeight || 600;
  const W = Math.min(app.size[0], dw - 24), H = Math.min(app.size[1], dh - 110), n = procs.size;
  const w = { id, pid, appId, min: false, max: false, w: W, h: H, z: 0, api: {},
    x: clamp(60 + n * 34, 8, Math.max(8, dw - W - 8)), y: clamp(24 + n * 30, 8, Math.max(8, dh - H - 100)) };
  const ttl = h('span', { class: 'ttl' }, app.name);
  w.setTitle = t => { ttl.textContent = t; };
  w.body = h('div', { class: 'wb' });
  const tb = h('div', { class: 'tb' },
    iconSpan(appId, 'tic'), ttl,
    h('button', { class: 'mn', html: ICO.min, onclick: () => minimize(id) }),
    h('button', { class: 'mx', html: ICO.max, onclick: () => toggleMax(id) }),
    h('button', { class: 'x', html: ICO.x, onclick: () => close(id) }));
  w.el = h('section', { class: 'win' }, tb, w.body);
  w.el.addEventListener('pointerdown', () => { if (front !== id || w.min) focus(id); }, true);
  place(w);
  winsEl.append(w.el);
  procs.set(id, w);
  try { w.api = (WIN_APPS[appId](w.body, w, arg)) || {}; } catch (e) { console.error(e); w.body.textContent = 'App crashed: ' + e.message; }
  focus(id);
  return w;
}
function place(w) { const s = w.el.style; s.left = w.x + 'px'; s.top = w.y + 'px'; s.width = w.w + 'px'; s.height = w.h + 'px'; }
function focus(id) {
  const w = procs.get(id); if (!w) return;
  w.min = false; w.z = ++zTop; w.el.style.zIndex = w.z; front = id; render();
  if (w.api.onFocus) w.api.onFocus();
}
function minimize(id) { const w = procs.get(id); if (!w) return; w.min = true; if (front === id) front = null; render(); }
function toggleMax(id) { const w = procs.get(id); if (!w) return; w.max = !w.max; if (w.max) { w.el.style.left = '0'; w.el.style.top = '0'; w.el.style.width = '100%'; w.el.style.height = 'calc(100% - 84px)'; } else place(w); focus(id); }
function close(id) {
  const w = procs.get(id); if (!w) return;
  try { if (w.api.destroy) w.api.destroy(); } catch (e) {}
  w.el.remove(); procs.delete(id);
  if (front === id) front = null;
  render();
}
function render() {
  for (const w of procs.values()) {
    w.el.classList.toggle('min', w.min);
  }
  const fw = front && procs.get(front);
  $('#ftitle').textContent = fw && !fw.min ? APPS[fw.appId].name : '';
}

const WIN_APPS = {};

WIN_APPS.terminal = (body, w) => {
  const out = h('div', { class: 't-out' });
  const inp = h('input', { class: 't-in', style: 'flex:1;background:none;border:0;color:inherit;outline:none;', autocomplete: 'off' });
  const wrap = h('div', { class: 'term' }, out, h('div', { style: 'display:flex;' }, h('span', { style: 'color:var(--accent)' }, '> '), inp));
  body.append(wrap);
  const print = (t) => { out.append(h('div', null, t)); wrap.scrollTop = wrap.scrollHeight; };
  print('ESMU SHELL 1.0\nType help for commands.');
  const cmds = {
    help() { return 'help ls pwd echo date whoami uname ps phone neofetch music clear'; },
    ls() { return 'welcome.txt\nnotes.txt\nDocuments/'; },
    pwd() { return '/home/user'; },
    echo(a) { return a.join(' '); },
    clear() { out.textContent = ''; return ''; },
    date() { return new Date().toString(); },
    whoami() { return 'user'; },
    uname() { return 'Esmu 1.0 esmu-kernel'; },
    ps() { return [...procs.values()].map(w => w.pid + ' ' + APPS[w.appId].name).join('\n') || 'PID NAME'; },
    async phone(a) {
      if (!NATIVE) throw new Error('only in Android app');
      const sub = a[0] || 'info';
      if (sub === 'info') { const d = await nat.call('device.info'); return d.manufacturer + ' ' + d.model + '\nBattery: ' + d.battery.level + '%'; }
      if (sub === 'apps') { const r = await nat.call('apps.list', { icons: false }); return r.items.map(x => x.label).join('\n'); }
      if (sub === 'ls') { const r = await nat.call('fs.list', { path: a[1] || '' }); return r.items.map(x => (x.dir ? 'd ' : '- ') + x.name).join('\n'); }
      if (sub === 'contacts') { const r = await nat.call('contacts.list', { limit: 50 }); return r.items.map(c => c.name + ' ' + c.number).join('\n'); }
      return 'phone info | apps | ls [path] | contacts';
    },
    neofetch() { return '  ESMU OS\n  -------\n  Apps: ' + Object.keys(APPS).length + '\n  Native: ' + (NATIVE ? 'yes' : 'no'); },
    music() { openApp('music'); return ''; }
  };
  async function run(line) {
    print('> ' + line);
    const parts = line.trim().split(/\s+/), cmd = parts[0], args = parts.slice(1);
    if (!cmd) return;
    if (cmds[cmd]) {
      try { const r = await cmds[cmd](args); if (r) print(r); } catch (e) { print(cmd + ': ' + e.message); }
    } else print(cmd + ': command not found');
  }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const l = inp.value; inp.value = ''; run(l); } });
  setTimeout(() => inp.focus(), 30);
  return { onFocus() { inp.focus(); } };
};

WIN_APPS.music = (body, w) => {
  let tracks = [], idx = -1, playing = false, curUri = null, curDur = 0;
  const listEl = h('div', { style: 'flex:1;overflow:auto;' });
  const nowEl = h('div', { style: 'padding:10px;text-align:center;font-weight:600' }, 'Nothing playing');
  const playBtn = h('button', { class: 'btn pri', onclick: toggle }, 'Play');
  const stopBtn = h('button', { class: 'btn', onclick: stop }, 'Stop');
  const nextBtn = h('button', { class: 'btn', onclick: () => step(1) }, 'Next');
  const prevBtn = h('button', { class: 'btn', onclick: () => step(-1) }, 'Prev');
  body.append(h('div', { style: 'display:flex;flex-direction:column;height:100%' }, 
    h('div', { style: 'display:flex;justify-content:center;gap:8px;padding:12px;' }, prevBtn, playBtn, nextBtn, stopBtn),
    nowEl, listEl));
  
  async function load() {
    if (!NATIVE) { listEl.append(h('div', { class: 'empty' }, 'Music only works inside Android app.')); return; }
    listEl.replaceChildren(h('div', { class: 'empty' }, 'Reading music…'));
    try {
      const r = await nat.call('music.list', {});
      tracks = r.items || [];
      if (!tracks.length) { listEl.replaceChildren(h('div', { class: 'empty' }, 'No music found.')); return; }
      draw();
    } catch (e) { listEl.replaceChildren(h('div', { class: 'empty' }, 'Error: ' + e.message)); }
  }
  function draw() {
    listEl.replaceChildren(...tracks.map(t => h('button', { class: 'f-row', style: 'width:100%;', onclick: () => playAt(tracks.indexOf(t)) },
        h('div', { class: 'f-main' }, h('div', null, t.title), h('div', { style: 'font-size:12px;color:var(--muted)' }, t.artist)))));
  }
  async function playAt(i) {
    if (i < 0 || i >= tracks.length) return;
    idx = i; const t = tracks[i]; curUri = t.uri; curDur = t.duration || 0;
    nowEl.textContent = '▶ ' + t.title;
    try { await nat.call('music.play', { uri: t.uri }); playing = true; playBtn.textContent = 'Pause'; }
    catch (e) { toast('Could not play: ' + e.message); }
  }
  async function toggle() {
    if (!curUri) { if (tracks.length) playAt(0); return; }
    try {
      if (playing) { await nat.call('music.pause', {}); playing = false; playBtn.textContent = 'Play'; }
      else { await nat.call('music.resume', {}); playing = true; playBtn.textContent = 'Pause'; }
    } catch (e) { toast(e.message); }
  }
  async function stop() { try { await nat.call('music.stop', {}); } catch (e) {} playing = false; curUri = null; nowEl.textContent = 'Nothing playing'; playBtn.textContent = 'Play'; }
  async function step(d) { if (!tracks.length) return; playAt((idx + d + tracks.length) % tracks.length); }
  load();
  return { destroy() { nat.call('music.stop', {}).catch(() => {}); } };
};

WIN_APPS.phone = (body, w) => {
  let tab = 'device', alive = true, stream = null, fsPath = '', facing = 'environment', appsCache = null;
  const panel = h('div', { style: 'flex:1;overflow:auto;' });
  const TABS = [['device', 'Device'], ['files', 'Files'], ['apps', 'Apps'], ['contacts', 'Contacts'], ['camera', 'Camera'], ['tools', 'Tools']];
  const seg = h('div', { class: 'seg', style: 'margin:8px;overflow-x:auto' }, TABS.map(([k, l]) => h('button', { 'data-t': k, 'aria-pressed': String(k === tab), onclick: () => show(k) }, l)));
  body.append(h('div', { style: 'display:flex;flex-direction:column;height:100%' }, seg, panel));
  const fail = e => toast(e && e.message ? e.message : String(e));
  const loading = t => panel.replaceChildren(h('div', { class: 'empty' }, t));
  const here = k => alive && tab === k;
  function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
  function show(k) {
    stopCam(); tab = k;
    [...seg.children].forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === k)));
    ({ device: pDevice, files: pFiles, apps: pApps, contacts: pContacts, camera: pCamera, tools: pTools })[k]();
  }
  async function ask(k) {
    try { const r = await nat.call('perm.request', { name: k }); if (r.pending) toast(r.note || 'Allow it in settings'); } catch (e) { fail(e); }
    show(tab);
  }

  async function pDevice() {
    loading('Reading…');
    try {
      const [d, st] = await Promise.all([nat.call('device.info'), nat.call('perm.status')]);
      if (!here('device')) return;
      const PERMS = [['storage', 'Files'], ['camera', 'Camera'], ['contacts', 'Contacts'], ['music', 'Music']];
      panel.replaceChildren(
        h('div', { class: 's-sec' }, h('h3', null, 'System'), h('div', null, d.manufacturer + ' ' + d.model), h('div', null, 'Battery: ' + d.battery.level + '%')),
        h('div', { class: 's-sec' }, h('h3', null, 'Permissions'), PERMS.map(([k, l]) => h('div', { class: 'ph-perm' }, h('span', null, l), st[k] ? h('b', { class: 'ph-ok' }, 'Allowed') : h('button', { class: 'btn pri', onclick: () => ask(k) }, 'Allow')))));
    } catch (e) { if (here('device')) panel.replaceChildren(h('div', { class: 'empty' }, e.message)); }
  }

  async function pFiles() {
    loading('Reading folder…');
    try {
      const r = await nat.call('fs.list', { path: fsPath });
      if (!here('files')) return;
      fsPath = r.path;
      const join = n => r.path + '/' + n;
      panel.replaceChildren(
        h('div', { style: 'padding:8px' }, h('button', { class: 'btn', onclick: () => { fsPath = r.path.replace(/\/[^/]+$/, '') || r.root; pFiles(); } }, 'Up')),
        r.items.length ? h('div', null, r.items.map(it => h('button', { class: 'f-row', style: 'width:100%', onclick: () => { if (it.dir) { fsPath = join(it.name); pFiles(); } } }, h('div', { class: 'f-main' }, it.name)))) : h('div', { class: 'empty' }, 'Empty folder.'));
    } catch (e) { panel.replaceChildren(h('div', { class: 'empty' }, e.message)); }
  }

  async function pApps() {
    loading('Reading apps…');
    try {
      if (!appsCache) appsCache = (await nat.call('apps.list', { icons: true })).items;
      if (!here('apps')) return;
      panel.replaceChildren(h('div', { class: 'ph-grid' }, appsCache.map(a => h('button', { onclick: () => nat.call('apps.launch', { pkg: a.pkg }) }, h('div', { style: 'text-align:center;font-size:12px;padding:8px; color:white' }, a.label)))));
    } catch (e) { panel.replaceChildren(h('div', { class: 'empty' }, e.message)); }
  }

  async function pContacts() {
    loading('Reading contacts…');
    try {
      const r = await nat.call('contacts.list', { limit: 100 });
      if (!here('contacts')) return;
      panel.replaceChildren(h('div', null, r.items.map(c => h('div', { class: 'f-row' }, h('div', { class: 'f-main' }, c.name + ' - ' + c.number)))));
    } catch (e) { panel.replaceChildren(h('div', { class: 'empty' }, e.message)); }
  }

  async function pCamera() {
    const v = h('video', { class: 'ph-video', autoplay: true, playsinline: true });
    v.muted = true;
    const snap = async () => {
      if (!stream) return;
      const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
      try { await nat.call('fs.writeBase64', { path: 'Pictures/Esmu/IMG_' + Date.now() + '.jpg', base64: c.toDataURL('image/jpeg').split(',')[1] }); toast('Saved photo'); } catch (e) { fail(e); }
    };
    panel.replaceChildren(h('div', null, v, h('div', { style: 'padding:10px' }, h('button', { class: 'btn pri', onclick: snap }, 'Take photo'))));
    try {
      stopCam();
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
      if (!here('camera')) { stopCam(); return; }
      v.srcObject = stream;
    } catch (e) { panel.append(h('div', { class: 'empty' }, 'Camera: ' + e.message)); }
  }

  function pTools() {
    panel.replaceChildren(h('div', { class: 's-sec' }, h('h3', null, 'Tools'), h('button', { class: 'btn', onclick: () => nat.call('vibrate', { ms: 100 }).catch(fail) }, 'Vibrate'), h('button', { class: 'btn', onclick: () => nat.call('settings.open', { page: 'wifi' }).catch(fail) }, 'Wi-Fi settings')));
  }

  show('device');
  return { destroy() { alive = false; stopCam(); } };
};

WIN_APPS.files = (body) => { body.append(h('div', { class: 'empty' }, 'Use Phone app to browse files.')); return {}; };
WIN_APPS.notes = (body) => {
  const ta = h('textarea', { style: 'flex:1;width:100%;padding:12px;background:var(--surface2);color:var(--text);border:0;outline:none;resize:none' });
  body.append(ta); ta.value = store.get('esmu.note', ''); ta.addEventListener('input', () => store.set('esmu.note', ta.value));
  setTimeout(() => ta.focus(), 30);
  return { onFocus() { ta.focus(); } };
};
WIN_APPS.calc = (body) => {
  let expr = '';
  const display = h('div', { style: 'font-size:42px;text-align:right;padding:20px;font-weight:700' }, '0');
  const keys = h('div', { style: 'display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px' }, ['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','←','='].map(k => h('button', { class: 'btn', style: 'height:52px;font-size:18px', onclick: () => {
    if (k === 'C') expr = ''; else if (k === '←') expr = expr.slice(0, -1); else if (k === '=') { try { expr = String(eval(expr)); } catch (e) { expr = 'Error'; } } else expr += k;
    display.textContent = expr || '0';
  } }, k)));
  body.append(h('div', { style: 'flex:1;display:flex;flex-direction:column' }, display, keys));
  return {};
};
WIN_APPS.clock = (body) => {
  const big = h('div', { style: 'font-size:64px;font-weight:700;text-align:center;padding:40px 20px' });
  body.append(big);
  const iv = setInterval(() => big.textContent = new Date().toLocaleTimeString(), 500);
  return { destroy() { clearInterval(iv); } };
};
WIN_APPS.settings = (body) => {
  body.append(h('div', { class: 's-sec' }, h('h3', null, 'About'), h('div', null, 'Esmu OS 1.0'), h('div', null, 'Native: ' + (NATIVE ? 'Yes' : 'No'))));
  return {};
};

const sys = { start: Date.now() };
function buildShell() {
  const grid = $('#grid'), dock = $('#dock');
  grid.replaceChildren(...Object.keys(APPS).map(k => h('button', { class: 'app', onclick: () => openApp(k) }, icon(k), h('span', null, APPS[k].name))));
  dock.replaceChildren(...Object.keys(APPS).filter(k => APPS[k].fav).map(k => h('button', { onclick: () => openApp(k) }, icon(k))));
}
function updateClock() {
  const d = new Date(), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  $('#clock').textContent = t;
  $('#w-time').textContent = t;
  $('#w-date').textContent = d.toLocaleDateString();
}
setInterval(updateClock, 1000); updateClock();

async function boot() {
  const b = $('#boot');
  $('#os').hidden = true; b.hidden = false; b.classList.remove('done');
  await sleep(800);
  b.classList.add('done'); await sleep(300);
  b.hidden = true; $('#os').hidden = false;
}
window.__esmuBack = () => { if (!$('#modal').hidden) { $('#modal').hidden = true; return true; } if (front) { minimize(front); return true; } return false; };
if (!NATIVE) delete APPS.phone;
buildShell();
boot();
})();
</script>
</body>
